# ===== Server =====
server.port=8080
spring.application.name=hireflow-api

# ===== Database =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hireflow}
spring.datasource.username=postgres
spring.datasource.password=#include
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Enable JPA Auditing
spring.jpa.properties.javax.persistence.validation.mode=none

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-days=7

# ===== Redis =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.cache.type=redis

# ===== Mail (MailHog for dev) =====
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ===== AWS S3 / MinIO =====
aws.s3.bucket-name=${S3_BUCKET:hireflow-bucket}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
aws.access-key=${AWS_ACCESS_KEY:minioadmin}
aws.secret-key=${AWS_SECRET_KEY:minioadmin}

# ===== Async =====
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=HireFlow-

# ===== File Upload =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===== OpenAPI / Swagger =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ===== App =====
app.base-url=${BASE_URL:http://localhost:8080}

# ===== Logging =====
logging.level.com.hireflow=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
